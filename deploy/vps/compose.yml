# API y worker en el VPS (extensión Docker de Plesk o `docker compose`).
# Secretos: en ./api.env (NO en el repositorio; permisos 600). Plantilla: api.env.example.
# La API solo escucha en 127.0.0.1:8787; Plesk (nginx) la publica con https en
# api-reputacion.eligemenu.com mediante una regla de proxy de Docker.
name: reputacion

x-app: &app
  image: ghcr.io/eligemenu-leo/reputacion-digital:${IMAGE_TAG:-staging}
  env_file: ./api.env
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: '8787'
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '5' }

services:
  api:
    <<: *app
    command: ['node', '--enable-source-maps', 'dist/server.js']
    ports: ['127.0.0.1:8787:8787']
    mem_limit: 512m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    command: ['node', '--enable-source-maps', 'dist/worker.js']
    mem_limit: 384m
