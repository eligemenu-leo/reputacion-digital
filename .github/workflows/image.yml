# Publica la imagen de la API y el worker en GitHub Container Registry.
# El VPS (Docker de Plesk) la descarga de ghcr.io/eligemenu-leo/reputacion-digital.
# La imagen no lleva secretos: todo se pasa por variables de entorno en el servidor.
name: Imagen

on:
  push:
    branches: [main, fase-4b-meta]
    paths-ignore: ['docs/**', '**/*.md', 'apps/web/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/fase-4b-meta' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Comprobar que la imagen resuelve sus dependencias
        run: |
          tag="$(echo "${{ steps.meta.outputs.tags }}" | head -1)"
          for entry in server worker; do
            out="$(timeout 60 docker run --rm "$tag" node dist/$entry.js 2>&1 || true)"
            if echo "$out" | grep -q ERR_MODULE_NOT_FOUND; then echo "$out" | head -5; exit 1; fi
          done
